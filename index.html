019\xE0 15 %. Un membre marocain du groupement r\xE9duit cet \xE9cart.","Visite des lieux obligatoire \xE0 Marrakech-Menara avant le d\xE9p\xF4t.","Offres en fran\xE7ais ; d\xE9p\xF4t papier ou \xE9lectronique via le portail national des march\xE9s publics."]},jvRationale:{en:"Lead a joint and several groupement as technical lead (\u224855%) with a vetted Moroccan civil and airport contractor (\u224845%). The partner brings the works classification, ONDA site experience and local labour supply; BritInfra leads baggage systems, design management and ORAT.",fr:"Piloter un groupement solidaire en tant que chef de file technique (\u224855 %) avec une entreprise marocaine v\xE9rifi\xE9e de g\xE9nie civil a\xE9roportuaire (\u224845 %). Le partenaire apporte la classification, l\u2019exp\xE9rience des sites ONDA et la main-d\u2019\u0153uvre locale ; BritInfra pilote les syst\xE8mes bagages, la gestion de la conception et l\u2019ORAT."},partners:["MA-104","MA-312","MA-508"]},{id:"t2",ref:"AOI N\xB0 HSR-07/2026/ONCF",authority:"ONCF",authorityFull:"Office National des Chemins de Fer",title:{en:"Kenitra\u2013Marrakech High-Speed Rail Signalling & Telecoms",fr:"Signalisation et t\xE9l\xE9communications de la LGV K\xE9nitra\u2013Marrakech"},sector:"Rail",worldCup:!0,valueGBP:64,daysLeft:60,scores:{aviation:91,energy:58,digital:86},offsets:[-2,3,1,-3],jv:"High",location:{en:"Kenitra\u2013Rabat\u2013Casablanca\u2013Marrakech corridor",fr:"Corridor K\xE9nitra\u2013Rabat\u2013Casablanca\u2013Marrakech"},procedure:{en:"International open tender with prequalification",fr:"Appel d\u2019offres international avec pr\xE9s\xE9lection"},execution:{en:"36 months, including 12-month operational support",fr:"36 mois, dont 12 mois d\u2019assistance \xE0 l\u2019exploitation"},bidBondMAD:6e6,framework:{en:`ONCF purchasing regulation, aligned with ${Tt.en}`,fr:`R\xE8glement des achats de l\u2019ONCF, align\xE9 sur le ${Tt.fr}`},summary:{en:"ONCF is extending high-speed services south from Kenitra to Marrakech to connect World Cup host cities. This lot covers ETCS Level 2 signalling, GSM-R / FRMCS-ready radio, fibre backbone and the operational control centre interfaces along the new alignment.",fr:"L\u2019ONCF prolonge la grande vitesse de K\xE9nitra \xE0 Marrakech pour relier les villes h\xF4tes de la Coupe du Monde. Ce lot couvre la signalisation ETCS niveau 2, la radio GSM-R compatible FRMCS, la dorsale fibre et les interfaces avec le poste central de commande."},scope:{en:["ETCS Level 2 trackside and interlocking design, supply and installation","GSM-R radio network with FRMCS migration path","Fibre-optic backbone and SCADA telecoms for traction power","Integration with the Casablanca operational control centre"],fr:["Conception, fourniture et pose de l\u2019ETCS niveau 2 et des enclenchements","R\xE9seau radio GSM-R avec trajectoire de migration FRMCS","Dorsale fibre optique et t\xE9l\xE9coms SCADA pour l\u2019alimentation traction","Int\xE9gration au poste central de commande de Casablanca"]},rationale:{aviation:{en:"Strong match: major transport systems integration and rail signalling references in the UK.",fr:"Forte ad\xE9quation : r\xE9f\xE9rences britanniques en int\xE9gration de grands syst\xE8mes de transport et en signalisation."},energy:{en:"Weak match: traction power interfaces only; signalling is outside an energy-led profile.",fr:"Faible ad\xE9quation : seules les interfaces d\u2019alimentation traction correspondent."},digital:{en:"Strong match on telecoms, fibre backbone and control-centre integration.",fr:"Forte ad\xE9quation sur les t\xE9l\xE9coms, la dorsale fibre et l\u2019int\xE9gration du poste de commande."}},considerations:{en:["Prequalification stage: financial capacity and three comparable signalling references required.","Interoperability with existing Tangier\u2013Kenitra Al Boraq systems must be demonstrated.","National preference applies; local subcontracting share is scored in the technical evaluation.","Large bid bond: arrange a UK bank counter-guarantee early."],fr:["Phase de pr\xE9s\xE9lection : capacit\xE9 financi\xE8re et trois r\xE9f\xE9rences comparables en signalisation exig\xE9es.","L\u2019interop\xE9rabilit\xE9 avec les syst\xE8mes Al Boraq Tanger\u2013K\xE9nitra doit \xEAtre d\xE9montr\xE9e.","Pr\xE9f\xE9rence nationale applicable ; la part de sous-traitance locale est not\xE9e dans l\u2019\xE9valuation technique.","Caution importante : organiser t\xF4t une contre-garantie d\u2019une banque britannique."]},jvRationale:{en:"Form a groupement with a Moroccan telecoms and IT integrator for fibre, civils interfaces and local O&M, with a PMO consultancy supporting interface management with ONCF. BritInfra leads signalling design and safety case.",fr:"Constituer un groupement avec un int\xE9grateur marocain IT et t\xE9l\xE9coms pour la fibre, les interfaces g\xE9nie civil et la maintenance locale, appuy\xE9 par un cabinet PMO pour la gestion des interfaces avec l\u2019ONCF. BritInfra pilote la conception de la signalisation et le dossier de s\xE9curit\xE9."},partners:["MA-415","MA-209","MA-508"]},{id:"t3",ref:"AO N\xB0 2026/MASEN/HYD-12",authority:"MASEN",authorityFull:"Moroccan Agency for Sustainable Energy",title:{en:"Casablanca Hybrid Solar & Desalination Engineering Consultancy",fr:"Ing\xE9nierie conseil pour un projet hybride solaire et dessalement \xE0 Casablanca"},sector:"Energy & Water",worldCup:!1,valueGBP:14.2,daysLeft:28,scores:{aviation:84,energy:97,digital:61},offsets:[-3,2,0,1],jv:"Moderate",location:{en:"Greater Casablanca",fr:"Grand Casablanca"},procedure:{en:"International restricted tender (consultancy services)",fr:"Appel d\u2019offres international restreint (prestations de conseil)"},execution:{en:"30 months, feasibility through construction supervision",fr:"30 mois, de la faisabilit\xE9 au suivi des travaux"},bidBondMAD:12e5,framework:{en:"MASEN procurement rules (state-owned company with its own purchasing regulation)",fr:"R\xE8gles d\u2019achat de MASEN (s
